name: Sync claude branch

# Keeps the `claude` branch level with main: each push to main fast-forwards it. If `claude` has commits main
# doesn't (work not merged yet), it is left alone and the run warns instead of overwriting it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward claude to main
        run: |
          if git push origin HEAD:refs/heads/claude; then
            echo "claude is now at $(git rev-parse --short HEAD)"
          else
            echo "::warning::claude has commits main lacks: merge them into main first; claude was not overwritten."
          fi
